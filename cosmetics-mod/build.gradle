// Vellora Cosmetics: the player's own look from the Vellora Client launcher in the game (Fabric and Quilt).
// Build: gradle build  ->  build/libs/vellora-cosmetics-<minecraft>-<version>.jar
plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = 'vellora'

base {
    archivesName = "vellora-cosmetics-${project.minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('../COPYING.md') {
        rename { "LICENSE_${base.archivesName.get()}" }
    }
}
