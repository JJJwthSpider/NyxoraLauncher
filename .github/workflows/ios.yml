# Nyxora Launcher for the iPhone, made on GitHub's machines: Amethyst (the Minecraft: Java Edition launcher for iOS)
# built from source on a Mac with Nyxora in it (ios/prepare.py: the name and icon, the menu with the lobby, the 3D player
# and the wardrobe, the look in the game). An iOS app can only be built with Xcode, so this is the only way without a
# Mac of your own. The quick job only renames Amethyst's own latest build (ios/brand_ipa.py: name and icon, no menu).
# The .ipa is an artifact of the run ("NyxoraLauncher-iPhone"), installed with SideStore as HOW-TO-IPHONE-RU.txt says.
name: iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  # the quick way: Amethyst's own latest build, given Nyxora's name, icon and texts (ios/brand_ipa.py); no compiling,
  # so without Nyxora's menu
  branded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Amethyst's latest build
        run: |
          curl -fSL -o amethyst.zip \
            https://nightly.link/AngelAuraMC/Amethyst-iOS/workflows/development/main/org.angelauramc.amethyst-ios.ipa.zip
          unzip -o amethyst.zip -d amethyst
          ls -la amethyst

      - name: Nyxora's name and icon
        run: |
          python3 -c "import PIL" 2>/dev/null || sudo apt-get install -y -q python3-pil
          mkdir -p out
          python3 ios/brand_ipa.py "$(ls amethyst/*.ipa | head -1)" out/NyxoraLauncher-iPhone.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NyxoraLauncher-iPhone-quick
          path: out/*.ipa
          if-no-files-found: error

  # the real one: Amethyst built from source with all of Nyxora's iPhone parts (ios/prepare.py)
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 8 (Amethyst's Java part is built with it)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Newest Xcode (Amethyst uses the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          x="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version

      - name: Tools
        run: |
          brew install ldid make
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Amethyst with Nyxora (name, icon, menu, look in the game)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow || true
          python3 ios/prepare.py build/amethyst

      - name: Build
        working-directory: build/amethyst
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 SLIMMED=1 \
            BOOTJDK="$JAVA_HOME/bin" SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          ls -la artifacts

      - name: Name the app file
        run: |
          mkdir -p out
          for f in build/amethyst/artifacts/*.ipa; do
            case "$f" in
              *slimmed*) cp "$f" out/NyxoraLauncher-iPhone-slim.ipa ;;
              *) cp "$f" out/NyxoraLauncher-iPhone.ipa ;;
            esac
          done
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NyxoraLauncher-iPhone
          path: out/*.ipa
          if-no-files-found: error
