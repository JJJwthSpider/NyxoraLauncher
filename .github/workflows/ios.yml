# Nyxora Launcher for the iPhone: Amethyst (the Minecraft: Java Edition launcher for iOS) with Nyxora's name and icon,
# built on GitHub's Macs (an iOS app can only be built with Xcode). ios/prepare.py says what changes; the .ipa is an
# artifact of the run ("NyxoraLauncher-iPhone"), installed with SideStore as HOW-TO-IPHONE-RU.txt says.
name: iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 8 (Amethyst's Java part is built with it)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Tools
        run: |
          brew install ldid make
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Amethyst with Nyxora's name and icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow || true
          python3 ios/prepare.py build/amethyst

      - name: Build
        working-directory: build/amethyst
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 SLIMMED=1 \
            BOOTJDK="$JAVA_HOME/bin" SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          ls -la artifacts

      - name: Name the app file
        run: |
          mkdir -p out
          for f in build/amethyst/artifacts/*.ipa; do
            case "$f" in
              *slimmed*) cp "$f" out/NyxoraLauncher-iPhone-slim.ipa ;;
              *) cp "$f" out/NyxoraLauncher-iPhone.ipa ;;
            esac
          done
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NyxoraLauncher-iPhone
          path: out/*.ipa
          if-no-files-found: error
